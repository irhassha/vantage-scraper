name: NPCT1 Scraper

on:
  schedule:
    # Berjalan otomatis setiap 2 jam (00:00, 02:00, 04:00, dst. UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Memungkinkan kamu trigger manual dari tombol di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # NPCT1 scraper menggunakan bs4 dan requests, tapi kita tetap install 
        # dependensi penuh jaga-jaga kalau ada fungsi bersama yang memerlukannya

    - name: Run NPCT1 Scraper
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python main_npct1.py
