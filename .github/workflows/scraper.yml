name: VANTAGE Vessel Scraper

on:
  # Dijadwalkan oleh pg_cron Supabase (job 'vantage-scraper', 20 0,2,4,6,8,12,16,20 * * * UTC) lewat
  # workflow_dispatch: cron GitHub sering melewatkan run. Lihat vantage-web
  # supabase/migrations/20261020050000_pg_cron_dispatch.sql.
  workflow_dispatch: # Juga untuk trigger manual dari tombol di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Pipeline
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python main.py