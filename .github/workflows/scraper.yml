name: VANTAGE Vessel Scraper

on:
  schedule:
    # Jam siang (07:00 - 15:20 WIB / 00:00 - 08:00 UTC): Berjalan setiap 2 jam (07:20, 09:20, 11:20, 13:20, 15:20 WIB)
    - cron: '20 0,2,4,6,8 * * *'
    # Setelah 15:20 WIB (12:00, 16:00, 20:00 UTC): Berjalan setiap 4 jam (19:20, 23:20, 03:20 WIB)
    - cron: '20 12,16,20 * * *'
  workflow_dispatch: # Memungkinkan kamu trigger manual dari tombol di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Pipeline
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python main.py