name: VANTAGE Vessel Scraper

on:
  schedule:
    # Berjalan setiap jam pada menit ke-15 (untuk menghindari lonjakan trafik bot di menit ke-00)
    - cron: '15 * * * *'
  workflow_dispatch: # Memungkinkan kamu trigger manual dari tombol di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install Playwright browsers (dibutuhkan oleh Crawl4ai)
        python -m playwright install chromium

    - name: Run Scraper
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python main.py