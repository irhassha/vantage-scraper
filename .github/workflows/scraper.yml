name: VANTAGE Vessel Scraper

on:
  schedule:
    # Siang (07:20 - 15:20 WIB tiap 2 jam: 0,2,4,6,8 UTC) & Malam (19:20, 23:20, 03:20 WIB tiap 4 jam: 12,16,20 UTC)
    - cron: '20 0,2,4,6,8,12,16,20 * * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tombol di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Pipeline
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python main.py