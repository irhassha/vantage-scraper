name: VANTAGE Vessel Scraper

on:
  schedule:
    # Berjalan otomatis setiap 4 jam (00:00, 04:00, 08:00, dst. UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Memungkinkan kamu trigger manual dari tombol di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install Playwright browsers beserta dependensi sistem (dibutuhkan oleh Crawl4ai)
        python -m playwright install --with-deps chromium

    - name: Run Scraper
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python main.py